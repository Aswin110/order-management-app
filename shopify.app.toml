# This file stores configurations for your Shopify app.
# client_id is filled in by `shopify app dev` / `shopify app config link`.
client_id = ""
name = "Order Operations"
handle = "order-operations"

# The web process lives in apps/web; this file stays at the workspace root so
# the Shopify CLI detects pnpm (pnpm-lock.yaml) and the workspace
# (pnpm-workspace.yaml), both of which it only looks for beside this file.
web_directories = ["apps/web"]

[access_scopes]
# Minimum scopes for the order operations dashboard: read orders for the
# dashboard/sync, write orders for bulk tag actions, read customers because
# the sync query in apps/worker/src/services/order-sync.ts selects
# order.customer { displayName email phone }.
scopes = "read_orders,write_orders,read_customers"

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Handled by: /app/routes/webhooks.orders.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders"
  topics = ["orders/create", "orders/updated", "orders/cancelled", "orders/fulfilled"]

  # Mandatory compliance topics for public apps
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
