# This file stores configurations for your Shopify app.
# client_id is filled in by `shopify app dev` / `shopify app config link`.
client_id = ""
name = "Order Operations"
handle = "order-operations"

# The web process lives in apps/web; this file stays at the workspace root so
# the Shopify CLI detects pnpm (pnpm-lock.yaml) and the workspace
# (pnpm-workspace.yaml), both of which it only looks for beside this file.
web_directories = ["apps/web"]

[access_scopes]
# Orders are read live through the Admin GraphQL API; write_orders covers
# bulk tag updates. There is no background sync, so no order webhooks.
scopes = "read_orders,write_orders"

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Mandatory compliance topics for public apps
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
